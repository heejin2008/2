<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 어떤 골퍼일까? | 골프 플레이어 유형 테스트</title>
<style>
  :root{
    --fairway-1:#0f4d3a;
    --fairway-2:#1f7a56;
    --sky:#bfe6f0;
    --sand:#f4ecd8;
    --flag:#e85d4e;
    --flag-dark:#c7452f;
    --ink:#0e2a22;
    --card-bg:#ffffff;
    --radius:24px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(191,230,240,0.55), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(232,93,78,0.18), transparent 40%),
      linear-gradient(160deg, var(--fairway-1) 0%, var(--fairway-2) 55%, #2f9668 100%);
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  /* dimple texture on background */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
    background-size:26px 26px;
    pointer-events:none;
    z-index:0;
  }
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
  }
  .flag-emoji{
    position:absolute;
    top:-18px;
    right:8px;
    font-size:34px;
    transform:rotate(8deg);
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.25));
    animation:sway 3s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{transform:rotate(8deg);}
    50%{transform:rotate(-4deg);}
  }
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 24px 60px rgba(6,30,20,0.35);
    padding:36px 30px 30px;
    animation:pop .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{
    from{opacity:0; transform:translateY(18px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  /* ---------- INTRO ---------- */
  .eyebrow{
    display:inline-block;
    background:var(--sand);
    color:var(--fairway-1);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.06em;
    padding:6px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }
  h1{
    font-size:30px;
    line-height:1.28;
    margin:0 0 12px;
    color:var(--fairway-1);
    letter-spacing:-.01em;
  }
  .sub{
    font-size:15.5px;
    color:#4a5f57;
    line-height:1.6;
    margin:0 0 26px;
  }
  .scorecard-line{
    display:flex;
    gap:10px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .chip{
    background:#f0f7f2;
    border:1px solid #dce9e0;
    color:var(--fairway-1);
    font-size:13px;
    font-weight:600;
    padding:7px 12px;
    border-radius:12px;
  }
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:16px;
    border-radius:100px;
    padding:15px 26px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--flag);
    color:#fff;
    box-shadow:0 10px 24px rgba(232,93,78,0.4);
    width:100%;
  }
  .btn-primary:hover{background:var(--flag-dark);}
  .btn-ghost{
    background:transparent;
    color:var(--fairway-1);
    border:1.5px solid #d7e6dc;
    width:100%;
    margin-top:10px;
  }
  .btn-ghost:hover{background:#f4f9f6;}
  /* ---------- PROGRESS ---------- */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:#eaf2ed;
    border-radius:100px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--fairway-2), var(--flag));
    border-radius:100px;
    transition:width .35s ease;
  }
  .progress-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--fairway-1);
    white-space:nowrap;
  }
  .q-count{
    font-size:12.5px;
    color:#8a9a91;
    font-weight:600;
    margin-bottom:6px;
  }
  .q-hint{
    display:inline-block;
    background:#eef7f1;
    color:var(--fairway-1);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }
  .q-text{
    font-size:21px;
    font-weight:700;
    line-height:1.4;
    color:var(--ink);
    margin:0 0 22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .option{
    text-align:left;
    background:#fbfdfc;
    border:1.5px solid #e4ede8;
    border-radius:16px;
    padding:16px 18px;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option:hover{
    border-color:var(--fairway-2);
    background:#f2f9f4;
    transform:translateX(2px);
  }
  .option .tag{
    display:inline-block;
    width:22px;
    height:22px;
    line-height:22px;
    text-align:center;
    border-radius:50%;
    background:var(--fairway-1);
    color:#fff;
    font-size:12px;
    font-weight:700;
    margin-right:10px;
  }
  /* ---------- RESULT ---------- */
  .result-badge{
    font-size:48px;
    margin-bottom:6px;
  }
  .result-eyebrow{
    font-size:13px;
    font-weight:700;
    color:var(--flag-dark);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .result-title{
    font-size:27px;
    font-weight:800;
    color:var(--fairway-1);
    margin:0 0 14px;
    line-height:1.3;
  }
  .result-desc{
    font-size:15px;
    line-height:1.7;
    color:#3c4d46;
    margin-bottom:18px;
  }
  .why-box{
    background:#f4faf6;
    border:1px dashed #cfe4d7;
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .why-box h3{
    margin:0 0 8px;
    font-size:13.5px;
    color:var(--fairway-1);
    font-weight:800;
  }
  .why-box p{
    margin:0;
    font-size:14px;
    line-height:1.65;
    color:#43574d;
  }
  .life-box{
    background:#fff6f2;
    border:1px dashed #f3c9be;
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .life-box h3{
    margin:0 0 8px;
    font-size:13.5px;
    color:var(--flag-dark);
    font-weight:800;
  }
  .life-box p{
    margin:0;
    font-size:14px;
    line-height:1.65;
    color:#5a3d36;
  }
  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-size:12.5px;
  }
  .bar-name{
    width:92px;
    flex-shrink:0;
    color:#5b6d64;
    font-weight:600;
  }
  .bar-track{
    flex:1;
    background:#eef4f0;
    border-radius:100px;
    height:8px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:100px;
    background:linear-gradient(90deg, var(--fairway-2), #7fd1a6);
    transition:width .6s ease;
  }
  .bars{
    margin:18px 0 22px;
  }
  .hidden{display:none;}
  footer.note{
    text-align:center;
    color:rgba(255,255,255,0.75);
    font-size:12.5px;
    margin-top:18px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div class="stage">
  <span class="flag-emoji">⛳</span>

  <!-- ============ INTRO ============ -->
  <div class="card" id="screen-intro">
    <span class="eyebrow">GOLF CLASS 아이스브레이킹</span>
    <h1>나는 어떤 골퍼일까?<br>골프 플레이어 유형 테스트</h1>
    <p class="sub">골프를 몰라도 전혀 상관없어요! 평소 나의 성향을 답하기만 하면, 그게 곧 나의 골프 스타일이 됩니다.<br>수업 시작 전, 나와 동료 학생들의 성향을 가볍게 알아가는 시간!</p>
    <div class="scorecard-line">
      <span class="chip">🔰 골프 몰라도 OK</span>
      <span class="chip">⏱ 약 1분 소요</span>
      <span class="chip">🎯 결과 5유형</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">테스트 시작하기</button>
  </div>

  <!-- ============ QUIZ ============ -->
  <div class="card hidden" id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">1 / 6</span>
    </div>
    <div class="q-count" id="q-count">QUESTION 1</div>
    <div class="q-hint" id="q-hint"></div>
    <p class="q-text" id="q-text"></p>
    <div class="options" id="q-options"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div class="card hidden" id="screen-result">
    <div class="result-badge" id="result-badge">🏆</div>
    <div class="result-eyebrow" id="result-eyebrow">YOUR GOLF TYPE</div>
    <h2 class="result-title" id="result-title"></h2>
    <p class="result-desc" id="result-desc"></p>

    <div class="why-box">
      <h3>💡 이렇게 추천했어요</h3>
      <p id="result-why"></p>
    </div>

    <div class="life-box">
      <h3>🌱 TMI: 인생에서도 이래요</h3>
      <p id="result-life"></p>
    </div>

    <div class="bars" id="result-bars"></div>

    <button class="btn btn-primary" onclick="restartQuiz()">다시 테스트하기</button>
  </div>

  <footer class="note">Made for 대학 골프 수업 · Claude Code로 제작</footer>
</div>

<script>
/* =========================================================
   1. 질문 데이터
   - 각 옵션의 type 값이 5개 유형(PW/PR/ST/FR/SO) 중 하나에 +1점을 부여
   - 6문항 x 4지선다 = 총 24개 옵션, 5개 유형에 고르게 배분되도록 설계
========================================================= */
const TYPES = {
  PW: { key:'PW' },
  PR: { key:'PR' },
  ST: { key:'ST' },
  FR: { key:'FR' },
  SO: { key:'SO' }
};

const questions = [
  {
    hint: "🏌️ 골프는 나이가 들어서도 즐길 수 있는 몇 안 되는 평생 스포츠예요",
    text: "골프를 평생 취미로 삼고 싶다는 마음이 든다면, 가장 큰 이유는?",
    options: [
      { label:"나이 들어서도 화끈하게 몸을 쓸 수 있어서", type:"PW" },
      { label:"꾸준히 실력을 쌓아가는 재미가 있어서", type:"PR" },
      { label:"나이가 들어도 효율적으로 즐길 수 있어서", type:"ST" },
      { label:"부담 없이 오래도록 즐길 수 있어서", type:"FR" }
    ]
  },
  {
    hint: "🤝 골프는 '나와의 싸움'이지만, 상대가 좋은 샷을 치면 다 같이 '나이스 샷!'을 외쳐주는 매너 스포츠예요",
    text: "골프의 매너 문화(나이스 샷 외치기 등)가 마음에 든다면, 가장 큰 이유는?",
    options: [
      { label:"서로를 세심하게 챙기는 문화라서", type:"PR" },
      { label:"품위 있게 예의를 지키는 방식이 좋아서", type:"ST" },
      { label:"편안하고 부담 없는 분위기라서", type:"FR" },
      { label:"함께 축하하고 어울리는 게 좋아서", type:"SO" }
    ]
  },
  {
    hint: "🚶 18홀(한 경기)을 다 돌면 약 10km를 걷게 돼요 - 걷기 운동 + 야외 힐링을 동시에",
    text: "골프가 체력관리와 힐링에 좋다는 점이 끌린다면, 가장 큰 이유는?",
    options: [
      { label:"계획적으로 체력을 관리할 수 있어서", type:"ST" },
      { label:"야외에서 힐링하며 여유를 즐길 수 있어서", type:"FR" },
      { label:"사람들과 함께 걸으며 어울릴 수 있어서", type:"SO" },
      { label:"몸을 확실하게 쓸 수 있어서", type:"PW" }
    ]
  },
  {
    hint: "🧠 골프는 샷 하나를 실수해도 다음 샷으로 바로 만회할 수 있는, 회복탄력성을 기르는 멘탈 게임이에요",
    text: "골프가 멘탈(회복탄력성)을 길러준다는 점이 끌린다면, 가장 큰 이유는?",
    options: [
      { label:"마음 편하게 툭툭 털고 넘어갈 수 있어서", type:"FR" },
      { label:"같이 하는 사람과 마음을 나눌 수 있어서", type:"SO" },
      { label:"실수해도 바로 다음 샷으로 만회할 수 있어서", type:"PW" },
      { label:"무엇이 문제였는지 되짚어볼 수 있어서", type:"PR" }
    ]
  },
  {
    hint: "✨ 골프웨어, 스크린골프처럼 요즘 감성과도 잘 맞닿아 있고, 취업 후에도 쓸모 있는 스킬이에요",
    text: "골프를 배워보고 싶다는 마음이 든다면, 가장 큰 이유는?",
    options: [
      { label:"친구들과 같이 즐길 수 있어서", type:"SO" },
      { label:"골프웨어나 스크린골프 같은 요즘 감성이 끌려서", type:"PW" },
      { label:"제대로 배워서 오래도록 잘하고 싶어서", type:"PR" },
      { label:"취업 후에도 쓸모 있는 스킬이 될 것 같아서", type:"ST" }
    ]
  },
  {
    hint: "🧍 새벽 스크린골프부터 퇴근 후 연습장까지 - 내 스케줄에 맞춰 언제든 즐길 수 있어요",
    text: "골프를 시간에 얽매이지 않고 즐기고 싶다는 마음이 든다면, 가장 큰 이유는?",
    options: [
      { label:"새벽이든 밤이든 바로 나갈 수 있어서", type:"PW" },
      { label:"내 페이스대로 혼자 연습할 수 있어서", type:"PR" },
      { label:"스크린골프로 유연하게 즐길 수 있어서", type:"ST" },
      { label:"정해진 날 없이 마음 내킬 때 즐길 수 있어서", type:"FR" }
    ]
  }
];

/* =========================================================
   2. 결과 유형 데이터
   - 각 유형마다 이름 / 이모지 / 설명 / 추천 이유 템플릿
========================================================= */
const results = {
  PW: {
    badge:"💪",
    title:"파워 드라이버형",
    desc:"평소에도 일단 부딪혀 보고 몸으로 익히는 편이시죠? 골프에서는 이런 성향을 '파워 드라이버형'이라고 불러요. 신중하게 재기보다 확실한 실행력으로 밀어붙이는 타입이라, 골프에서도 거침없이 뻗어나가는 드라이버 샷과 잘 어울립니다.",
    why:"'나이 들어서도 화끈하게 몸을 쓰고 싶어서', '실수해도 바로 만회할 수 있어서'를 선택하셨어요. 신중하게 재기보다 확실한 실행력으로 밀어붙이는 성향이 두드러졌습니다.",
    life:"골프를 '인생의 축소판'이라고 하죠. 완벽한 계획을 기다리기보다 일단 부딪히며 길을 만들어가는 사람이에요. 실패를 크게 두려워하지 않는 만큼, 그 실행력이 결국 남들보다 한발 앞서게 만들어줍니다."
  },
  PR: {
    badge:"🎯",
    title:"정교한 아이언형",
    desc:"화려함보다 정확함과 디테일을 먼저 챙기는 편이시죠? 골프에서는 이런 성향을 '정교한 아이언형'이라고 불러요. 원리부터 꼼꼼히 파악하는 스타일이라, 원하는 지점에 정확히 볼을 보내는 아이언 샷과 잘 맞습니다.",
    why:"'꾸준히 실력을 쌓아가는 재미', '무엇이 문제였는지 되짚어보고 싶어서'를 선택한 응답이 많았어요. 화려함보다 정확도와 꼼꼼함을 우선하는 성향이 뚜렷했습니다.",
    life:"삶에서도 화려한 한방보다 꾸준한 노력을 믿는 사람이에요. 작은 디테일을 놓치지 않고 차근차근 쌓아올리는 타입이라, 시간이 좀 걸리더라도 결국 원하는 지점에 정확히 도달합니다."
  },
  ST: {
    badge:"🧠",
    title:"전략가 퍼터형",
    desc:"효율과 계산을 먼저 따지는 편이시죠? 골프에서는 이런 성향을 '전략가 퍼터형'이라고 불러요. 힘보다 두뇌 플레이로 승부하는 타입이라, 결국 계산이 승부를 가르는 퍼팅과 잘 어울립니다.",
    why:"'효율적으로 즐길 수 있어서', '취업 후에도 쓸모 있는 스킬이 될 것 같아서'를 선택한 응답이 많았어요. 감정보다 논리와 실용성으로 판단하는 성향이 두드러졌습니다.",
    life:"삶에서도 감이 아니라 계산으로 움직이는 사람이에요. 무작정 애쓰기보다 최소한의 노력으로 최대의 결과를 만드는 효율을 중요하게 여기고, 그 판단력이 중요한 순간마다 빛을 발합니다."
  },
  FR: {
    badge:"🌤️",
    title:"자유로운 힐링 골퍼형",
    desc:"결과보다 과정과 여유를 즐기는 편이시죠? 골프에서는 이런 성향을 '자유로운 힐링 골퍼형'이라고 불러요. 스코어에 얽매이기보다 그 순간을 만끽하며 골프를 통해 힐링을 얻는 타입입니다.",
    why:"'부담 없이 오래도록 즐길 수 있어서', '마음 편하게 툭툭 털고 넘어갈 수 있어서'를 선택하셨어요. 결과보다 과정과 여유를 우선하는 태도가 가장 강하게 나타났습니다.",
    life:"삶에서도 결과보다 과정을 소중히 여기는 사람이에요. 남들과 비교하며 조급해하기보다 자기 속도를 지키는 여유가 있고, 그 덕분에 오래도록 지치지 않고 나아갑니다."
  },
  SO: {
    badge:"🤝",
    title:"소셜 팀플레이형",
    desc:"혼자보다 함께할 때 에너지를 얻는 편이시죠? 골프에서는 이런 성향을 '소셜 팀플레이형'이라고 불러요. 분위기와 관계를 중요하게 여기는 타입이라, 동반자와의 케미가 중요한 라운드에서 빛을 발합니다.",
    why:"'함께 축하하고 어울리는 게 좋아서', '친구들과 같이 즐길 수 있어서'를 선택한 응답이 많았어요. 혼자보다 함께하는 경험을 우선하는 성향이 결과를 이끌었습니다.",
    life:"삶에서도 혼자보다 함께일 때 더 큰 힘을 내는 사람이에요. 관계 속에서 에너지를 얻고, 그렇게 만든 좋은 분위기가 결국 주변 사람들에게도 좋은 영향을 줍니다."

/* =========================================================
   3. 로직: 상태 관리 + 화면 전환 + 채점
========================================================= */
let current = 0;
let scores = { PW:0, PR:0, ST:0, FR:0, SO:0 };

function startQuiz(){
  current = 0;
  scores = { PW:0, PR:0, ST:0, FR:0, SO:0 };
  show('screen-quiz');
  renderQuestion();
}

function show(id){
  ['screen-intro','screen-quiz','screen-result'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
}

function renderQuestion(){
  const q = questions[current];
  document.getElementById('q-count').textContent = `QUESTION ${current+1}`;
  document.getElementById('q-hint').textContent = q.hint;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-label').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('progress-fill').style.width = `${(current)/questions.length*100}%`;

  const wrap = document.getElementById('q-options');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="tag">${letters[i]}</span>${opt.label}`;
    btn.onclick = () => selectOption(opt.type);
    wrap.appendChild(btn);
  });
}

function selectOption(type){
  scores[type] += 1;
  current += 1;
  if(current < questions.length){
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = `100%`;
    setTimeout(showResult, 200);
  }
}

function showResult(){
  // 최고 점수 유형 찾기 (동점이면 questions 배열 등장 순서상 먼저 매칭된 타입 우선)
  let bestKey = 'PW';
  let bestScore = -1;
  Object.keys(scores).forEach(k=>{
    if(scores[k] > bestScore){
      bestScore = scores[k];
      bestKey = k;
    }
  });

  const r = results[bestKey];
  document.getElementById('result-badge').textContent = r.badge;
  document.getElementById('result-title').textContent = r.title;
  document.getElementById('result-desc').textContent = r.desc;
  document.getElementById('result-why').textContent = r.why;
  document.getElementById('result-life').textContent = r.life;

  // 점수 막대 그래프
  const barsWrap = document.getElementById('result-bars');
  barsWrap.innerHTML = '';
  const maxPossible = questions.length; // 이론상 한 유형이 받을 수 있는 최대치
  Object.keys(results).forEach(k=>{
    const row = document.createElement('div');
    row.className = 'bar-row';
    const pct = Math.round((scores[k]/maxPossible)*100);
    row.innerHTML = `
      <span class="bar-name">${results[k].title.replace('형','')}</span>
      <div class="bar-track"><div class="bar-fill" style="width:0%" data-pct="${pct}"></div></div>
      <span>${scores[k]}</span>
    `;
    barsWrap.appendChild(row);
  });

  show('screen-result');

  // 애니메이션 트리거
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{
      el.style.width = el.dataset.pct + '%';
    });
  });
}

function restartQuiz(){
  show('screen-intro');
}
</script>
